name: 每日新闻联播文字版

on:
  # 主定时已迁移到 Cloudflare Cron Trigger(秒级精度): 每 2 分钟轮询 19:35-21:30 北京,
  # 央视网当日节目单一上线(联播结束约 19:40 后)即在 2 分钟内触发推送 —— 做到"最快送达",
  # 且不再死守 19:50(新闻联播偶尔会超时), 联播一结束就尽量早推。
  # 下面 GitHub 自带 cron 仅作兜底备份(它的 cron 是"尽力而为", 会延迟/丢弃, 不作主用):
  # 万一 Cloudflare 当天没跑, GitHub 还能多时段补; 脚本幂等, 已推送则自动跳过, 不重复发。
  # cron 按 UTC 计时(北京=UTC+8):
  schedule:
    - cron: '40 11 * * *'   # 19:40 北京 兜底
    - cron: '10 12 * * *'   # 20:10 北京 兜底
    - cron: '40 12 * * *'   # 20:40 北京 兜底
    - cron: '10 13 * * *'   # 21:10 北京 兜底
  # 手动触发：默认走幂等逻辑（当天已归档则跳过）；
  # 勾选 force 可强制重抓重推（用于验证飞书卡片、或当天内容有误需重发）。
  # 注意：Cloudflare Worker 轮询触发时不带 force，避免一天内反复重推。
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新抓取并推送（忽略「当天已归档」的幂等跳过）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: news-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 普通检出完整历史，后续只做「新增文件 + 普通 push」，
      # 不会 force push / reset，已有归档与提交历史不受影响
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取归档并推送飞书
        id: run
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}   # 机器人开了签名校验才需要配
          # 只有手动触发且显式勾选 force 才强制重推；cron / Cloudflare 轮询一律走幂等
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.force == 'true' || github.event.inputs.force == true) && 'true' || 'false' }}
          RESULT_FILE: ${{ runner.temp }}/news_result.log
        run: |
          set -uo pipefail
          set +e
          python build.py 2>&1 | tee "$RESULT_FILE"
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 抓取/推送失败不让整个 job 变红，结论统一在「汇总」里展示
          exit 0

      - name: 汇总
        if: always()
        env:
          RESULT_FILE: ${{ runner.temp }}/news_result.log
        run: |
          set -uo pipefail
          {
            echo "### 每日新闻联播运行报告"
            echo ""
            echo "- 运行时间：$(date -u '+%Y-%m-%d %H:%M UTC')（cron 为 UTC）"
            echo "- 触发方式：${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RESULT_FILE" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            grep -E "归档日期|飞书推送|已存在|✅|FATAL|\[WARN\]" "$RESULT_FILE" >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "- 未产出日志，请查看上方步骤输出" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 提交并推送（只新增归档，不动已有文件）
        if: steps.run.outputs.exit_code == '0'
        run: |
          git config user.name "news-daily-bot"
          git config user.email "news-daily-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "无更新（当日已归档或内容未变化）"
          else
            git commit -m "auto: 新闻联播 $(date -u '+%Y-%m-%d')"
            git push
          fi
