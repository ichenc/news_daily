name: 每日新闻联播文字版

on:
  schedule:
    # 需求：每天北京时间 19:50 左右收到当天新闻联播。
    # 新闻联播 19:00-19:38 播出，约 19:40 后央视网当日节目页才上线，
    # 因此把触发点集中在 19:50 前后的窗口内。
    #
    # GitHub 的 cron 是尽力而为：高负载时会延迟，甚至静默丢弃整次运行。
    # 所以窗口内安排 4 个点互为兜底（间隔 ~5 分钟）——只要有一个在窗口内跑到，
    # 当天就完成了；脚本幂等，窗口内重复触发不会重复推送。
    #
    # 注意：已删除原先 08:10 / 22:10 的离谱时段，避免被 GitHub 延迟到凌晨才送达。
    # 注意 cron 按 UTC 计时，下面是 UTC，括号内为北京时间（UTC+8）。
    - cron: '50 11 * * *'   # 11:50 UTC = 19:50 北京（主时段）
    - cron: '55 11 * * *'   # 11:55 UTC = 19:55 北京（备份，当日页可能还没好 → 自动跳过）
    - cron: '0 12 * * *'    # 12:00 UTC = 20:00 北京（备份）
    - cron: '5 12 * * *'    # 12:05 UTC = 20:05 北京（备份，窗口边缘）
  workflow_dispatch: {}     # 手动触发：强制重新抓取并推送（绕过幂等跳过）

permissions:
  contents: write

concurrency:
  group: news-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 普通检出完整历史，后续只做「新增文件 + 普通 push」，
      # 不会 force push / reset，已有归档与提交历史不受影响
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取归档并推送飞书
        id: run
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}   # 机器人开了签名校验才需要配
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          RESULT_FILE: ${{ runner.temp }}/news_result.log
        run: |
          set -uo pipefail
          set +e
          python build.py 2>&1 | tee "$RESULT_FILE"
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 抓取/推送失败不让整个 job 变红，结论统一在「汇总」里展示
          exit 0

      - name: 汇总
        if: always()
        env:
          RESULT_FILE: ${{ runner.temp }}/news_result.log
        run: |
          set -uo pipefail
          {
            echo "### 每日新闻联播运行报告"
            echo ""
            echo "- 运行时间：$(date -u '+%Y-%m-%d %H:%M UTC')（cron 为 UTC）"
            echo "- 触发方式：${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RESULT_FILE" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            grep -E "归档日期|飞书推送|已存在|✅|FATAL|\[WARN\]" "$RESULT_FILE" >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "- 未产出日志，请查看上方步骤输出" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 提交并推送（只新增归档，不动已有文件）
        if: steps.run.outputs.exit_code == '0'
        run: |
          git config user.name "news-daily-bot"
          git config user.email "news-daily-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "无更新（当日已归档或内容未变化）"
          else
            git commit -m "auto: 新闻联播 $(date -u '+%Y-%m-%d')"
            git push
          fi
