name: 每日新闻联播文字版

on:
  # 主定时在 Cloudflare Cron Trigger：每 2 分钟轮询 19:00-22:00 北京，
  # 央视网当日节目单一出现就触发本 workflow；本 workflow 内部会「等联播播完」
  # 再推送（build.py 的 wait_for_complete：整期视频上线 + 条目稳定 90s），
  # 所以联播超时到 19:50 也不会推出半截稿（2026-11-12 漏稿事故的修复点）。
  # 下面 GitHub 自带 cron 仅作兜底（它的 cron 是"尽力而为"，会延迟/丢弃，不作主用）：
  # 脚本幂等，已推送且条目未增加则自动跳过，不重复发。
  # cron 按 UTC 计时（北京=UTC+8）：
  schedule:
    - cron: '40 11 * * *'   # 19:40 北京 兜底
    - cron: '10 12 * * *'   # 20:10 北京 兜底
    - cron: '40 12 * * *'   # 20:40 北京 兜底
    - cron: '10 13 * * *'   # 21:10 北京 兜底
  # 手动触发：默认走幂等逻辑（当天已归档则跳过）；
  # 勾选 force 可强制重抓重推（用于验证飞书卡片、或当天内容有误需重发）。
  # 注意：Cloudflare Worker 轮询触发时不带 force，避免一天内反复重推。
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新抓取并推送（忽略「当天已归档」的幂等跳过）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: news-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # build.py 需要轮询等待「联播播完」（最长到 20:20 北京），
    # 所以这里必须留足时间，10 分钟会被中途杀掉。
    timeout-minutes: 90
    steps:
      # 普通检出完整历史，后续只做「新增文件 + 普通 push」，
      # 不会 force push / reset，已有归档与提交历史不受影响
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取归档并推送飞书
        id: run
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}   # 机器人开了签名校验才需要配
          # 只有手动触发且显式勾选 force 才强制重推；cron / Cloudflare 轮询一律走幂等
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.force == 'true' || github.event.inputs.force == true) && 'true' || 'false' }}
          RESULT_FILE: ${{ runner.temp }}/news_result.log
        run: |
          set -uo pipefail
          set +e
          python build.py 2>&1 | tee "$RESULT_FILE"
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 抓取/推送失败不让整个 job 变红，结论统一在「汇总」里展示
          exit 0

      - name: 汇总
        if: always()
        env:
          RESULT_FILE: ${{ runner.temp }}/news_result.log
        run: |
          set -uo pipefail
          {
            echo "### 每日新闻联播运行报告"
            echo ""
            echo "- 运行时间：$(date -u '+%Y-%m-%d %H:%M UTC')（cron 为 UTC）"
            echo "- 触发方式：${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RESULT_FILE" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            grep -E "归档日期|完整性|补全|飞书推送|已存在|已归档|✅|FATAL|\[WARN\]" "$RESULT_FILE" >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "- 未产出日志，请查看上方步骤输出" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 提交并推送（只新增归档，不动已有文件）
        if: steps.run.outputs.exit_code == '0'
        run: |
          git config user.name "news-daily-bot"
          git config user.email "news-daily-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "无更新（当日已归档或内容未变化）"
          else
            git commit -m "auto: 新闻联播 $(date -u '+%Y-%m-%d')"
            git push
          fi
